<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shmoto Diller</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300;400&display=swap" rel="stylesheet">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background-color: #ffffff;
    font-family: 'Jost', sans-serif;
  }

  header {
    width: 100%;
    padding: 10vw 5% 6vw 8%;
  }

  .logo {
    font-size: clamp(2rem, 8vw, 4rem);
    font-weight: 300;
    letter-spacing: 0.15em;
    color: #1a1a1a;
    text-transform: uppercase;
    white-space: nowrap;
    line-height: 1;
  }

  .tagline {
    font-size: clamp(0.85rem, 2.5vw, 1rem);
    font-weight: 300;
    color: #1a1a1a;
    margin-top: -2px;
    margin-left: 2px;
    letter-spacing: 0.02em;
  }

  @media (max-width: 480px) {
    .logo {
      letter-spacing: 0.08em;
    }
  }
</style>
</head>
<body>

<header>
  <div class="logo">Shmoto Diller</div>
  <div class="tagline">only legit items!</div>
</header>

</body>
</html>
