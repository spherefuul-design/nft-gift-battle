<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shmoto Diller</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300;400&display=swap" rel="stylesheet">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background-color: #ffffff;
    font-family: 'Jost', sans-serif;
  }

  header {
    width: 100%;
    padding: 6vw 5% 6vw 8%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: nowrap;
  }

  .brand {
    display: flex;
    flex-direction: column;
  }

  .logo {
    font-size: clamp(2rem, 8vw, 4rem);
    font-weight: 300;
    letter-spacing: 0.15em;
    color: #1a1a1a;
    text-transform: uppercase;
    white-space: nowrap;
    line-height: 1;
  }

  .tagline {
    font-size: clamp(0.85rem, 2.5vw, 1rem);
    font-weight: 300;
    color: #1a1a1a;
    margin-top: -2px;
    margin-left: 2px;
    letter-spacing: 0.02em;
  }

  @media (max-width: 480px) {
    .logo {
      letter-spacing: 0.08em;
    }
  }

  .icons {
    display: flex;
    align-items: center;
    gap: clamp(14px, 3vw, 26px);
    flex-shrink: 0;
  }

  .icon-btn {
    background: none;
    border: none;
    cursor: pointer;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .icon-btn svg {
    width: clamp(20px, 4.5vw, 26px);
    height: clamp(20px, 4.5vw, 26px);
    stroke: #1a1a1a;
    fill: none;
    stroke-width: 1.3;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .icon-btn:hover svg {
    opacity: 0.6;
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="logo">Shmoto Diller</div>
    <div class="tagline">only legit items!</div>
  </div>

  <div class="icons">
    <button class="icon-btn" aria-label="Кошик">
      <svg viewBox="0 0 24 24">
        <path d="M6 6h15l-1.5 9h-12z"></path>
        <path d="M6 6l-1-3H2"></path>
        <circle cx="9" cy="20" r="1"></circle>
        <circle cx="17" cy="20" r="1"></circle>
      </svg>
    </button>

    <button class="icon-btn" aria-label="Пошук">
      <svg viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="7"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
    </button>
  </div>
</header>

</body>
</html>
